name: Release

# Pushing a version tag (v0.1.0) builds the Windows installer from that exact commit and attaches it,
# with latest.yml and the .blockmap that auto-update reads, to the GitHub release for the tag. The
# release notes come from docs/releases/<tag>.md, which must carry the completed Windows smoke
# checklist (spec "Ground truth"), so a tag cannot be released before the owner has run
# docs/windows-smoke.md.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    name: installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      NOTES: docs/releases/${{ github.ref_name }}.md
    steps:
      - uses: actions/checkout@v4
      - name: Check tag, version and release notes
        run: |
          version="v$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match apps/desktop version $version"
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "::error::$NOTES is missing"
            exit 1
          fi
          if grep -q 'Smoke result: pending' "$NOTES"; then
            echo "::error::$NOTES still says 'Smoke result: pending'; paste the completed docs/windows-smoke.md checklist first"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wow/desktop build
      - run: pnpm --filter @wow/desktop exec install-electron
      - run: pnpm --filter @wow/desktop smoke
      - run: pnpm --filter @wow/desktop dist
      - name: Attach the installer and update metadata to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Installed apps find updates through latest.yml and download the installer it names, with
        # the .blockmap for differential downloads. The release must be stable (not draft or
        # prerelease) or electron-updater ignores it.
        run: |
          dir=apps/desktop/release
          installer="$dir/wow-setup-${TAG#v}.exe"
          files=("$installer" "$installer.blockmap" "$dir/latest.yml")
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not built"
              exit 1
            fi
          done
          if ! grep -q "wow-setup-${TAG#v}.exe" "$dir/latest.yml"; then
            echo "::error::latest.yml does not point at wow-setup-${TAG#v}.exe"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --latest --title "wow ${TAG#v}" --notes-file "$NOTES"
          fi
