name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: git diff --check

  # Playwright against the mock providers, the Outlook mock and the mock trackers (spec "Ground
  # truth"). Nothing here talks to a real provider, Outlook or tracker.
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wow/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.os }}
          path: apps/web/test-results
          if-no-files-found: ignore

  # Builds the Windows installer and keeps it as a workflow artifact. Unsigned. The auto-update
  # files (latest.yml and the installer's .blockmap) must come out of `dist` next to it.
  desktop-installer:
    name: desktop installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wow/desktop build
      # The electron package downloads its binary on demand; the smoke run needs it.
      - run: pnpm --filter @wow/desktop exec install-electron
      # The bundled server under Electron's Node: better-sqlite3 loads, RPC answers, clean stop.
      - run: pnpm --filter @wow/desktop smoke
      - run: pnpm --filter @wow/desktop dist
      # electron-updater finds the release through latest.yml, which names this installer.
      - name: check auto-update files
        working-directory: apps/desktop/release
        run: |
          installer=$(ls wow-setup-*.exe)
          test -f latest.yml
          test -f "$installer.blockmap"
          grep -q "path: $installer" latest.yml
          test -f win-unpacked/resources/app-update.yml
          grep -q 'provider: github' win-unpacked/resources/app-update.yml
          cat latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: wow-installer-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
