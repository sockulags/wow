# Windows installer for wow. Run `pnpm --filter @wow/desktop build` first; `dist` packages out/.
# No code signing in this version.
appId: dev.wow.desktop
productName: wow
copyright: Copyright © 2026 wow
directories:
  output: release
  buildResources: build
# Everything the app runs is bundled into out/, so no node_modules are packaged or rebuilt.
files:
  - package.json
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - out/assets/**
  - '!**/*.map'
# Auto-update reads GitHub Releases of sockulags/wow (behavior 35). With a publish provider, `dist`
# writes latest.yml and the installer's .blockmap next to the installer and puts app-update.yml in
# the packaged resources for electron-updater. `dist` still runs with --publish never: the release
# workflow uploads the three files to a stable (not draft, not prerelease) release.
publish:
  provider: github
  owner: sockulags
  repo: wow
  releaseType: release
npmRebuild: false
nodeGypRebuild: false
# The server runs from real files: PowerShell must read the Outlook bridge script and the native
# SQLite module must load, neither of which works from inside app.asar.
extraResources:
  - from: out/server
    to: server
    filter:
      - '**/*'
      - '!**/*.map'
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  executableName: wow
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: wow
  artifactName: wow-setup-${version}.${ext}
  # Start wow when the installer finishes.
  runAfterFinish: true
